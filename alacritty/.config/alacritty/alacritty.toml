# Generated by scripts/render-theme. Edit themes/current.toml or themes/*.toml instead.
[terminal.shell]
program = "/home/pm-gusmano/.nix-profile/bin/zellij"
args = ["attach", "--create", "main"]

[window.padding]
x = 2
y = 2

[font]
size = 12
normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
  { key = "Enter", mods = "Alt", action = "ReceiveChar" },
]

[colors.primary]
background = "#eff1f5"
foreground = "#4c4f69"
dim_foreground = "#7c7f93"
bright_foreground = "#4c4f69"

[colors.cursor]
text = "#eff1f5"
cursor = "#dc8a78"

[colors.vi_mode_cursor]
text = "#eff1f5"
cursor = "#7287fd"

[colors.search.matches]
foreground = "#eff1f5"
background = "#6c6f85"

[colors.search.focused_match]
foreground = "#eff1f5"
background = "#40a02b"

[colors.footer_bar]
foreground = "#4c4f69"
background = "#dce0e8"

[colors.hints.start]
foreground = "#eff1f5"
background = "#df8e1d"

[colors.hints.end]
foreground = "#4c4f69"
background = "#dce0e8"

[colors.selection]
